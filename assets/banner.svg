<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="usGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="euGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowOrbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowOrbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .beacon-ring {
        animation: beaconPulse 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: center;
      }
      .beacon-ring-delay {
        animation: beaconPulse 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.4s;
        transform-origin: center;
      }
      .data-stream {
        stroke-dasharray: 12, 16;
        animation: streamFlow 25s linear infinite;
      }
      .data-stream-fast {
        stroke-dasharray: 8, 12;
        animation: streamFlowRev 16s linear infinite;
      }
      .float-slow {
        animation: floatY 6s ease-in-out infinite;
      }
      .float-alt {
        animation: floatAlt 7s ease-in-out infinite;
      }
      .pulse-glow {
        animation: glowCycle 4s ease-in-out infinite;
      }
      .twinkle-1 {
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      .twinkle-2 {
        animation: twinkle 4.5s ease-in-out infinite 1.5s alternate;
      }
      .twinkle-3 {
        animation: twinkle 3.8s ease-in-out infinite 0.7s alternate;
      }
      .bar-anim-1 {
        animation: barBreath1 4s ease-in-out infinite alternate;
        transform-origin: left center;
      }
      .bar-anim-2 {
        animation: barBreath2 4.5s ease-in-out infinite 0.5s alternate;
        transform-origin: left center;
      }
      .bar-anim-3 {
        animation: barBreath3 5s ease-in-out infinite 1s alternate;
        transform-origin: left center;
      }

      @keyframes streamFlow {
        from { stroke-dashoffset: 500; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowRev {
        from { stroke-dashoffset: -400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes glowCycle {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 10px rgba(56,189,248,0.3)); }
        50% { opacity: 1; filter: drop-shadow(0 0 22px rgba(129,140,248,0.7)); }
      }
      @keyframes beaconPulse {
        0% { r: 4; opacity: 0.9; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes barBreath1 {
        0% { width: 195px; }
        100% { width: 215px; }
      }
      @keyframes barBreath2 {
        0% { width: 140px; }
        100% { width: 155px; }
      }
      @keyframes barBreath3 {
        0% { width: 65px; }
        100% { width: 78px; }
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .text-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Clip bounds with rounded corners -->
  <clipPath id="bannerClip">
    <rect x="0" y="0" width="1200" height="440" rx="20" ry="20" />
  </clipPath>

  <g clip-path="url(#bannerClip)">
    <!-- Main Background -->
    <rect width="1200" height="440" fill="url(#bgGrad)" />

    <!-- Grid Lines -->
    <rect width="1200" height="440" fill="url(#grid)" />

    <!-- Ambient Glowing Light Orbs -->
    <circle cx="150" cy="70" r="220" fill="url(#glowOrbGrad1)" />
    <circle cx="1080" cy="380" r="240" fill="url(#glowOrbGrad2)" />
    <circle cx="680" cy="180" r="180" fill="url(#glowOrbGrad1)" opacity="0.4" />

    <!-- Animated Circuit / Flow Lines Across Banner -->
    <path d="M -50 140 C 250 80, 450 220, 750 130 C 950 70, 1100 170, 1250 120" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="data-stream" />
    <path d="M -50 320 C 300 370, 520 250, 800 330 C 1000 390, 1150 300, 1250 340" fill="none" stroke="url(#lineGrad)" stroke-width="1.8" class="data-stream-fast" opacity="0.6" />

    <!-- Twinkling Data Constellation Nodes -->
    <circle cx="120" cy="90" r="2" fill="#38bdf8" class="twinkle-1" />
    <circle cx="280" cy="220" r="2.5" fill="#818cf8" class="twinkle-2" />
    <circle cx="480" cy="80" r="2" fill="#38bdf8" class="twinkle-3" />
    <circle cx="620" cy="360" r="3" fill="#ec4899" class="twinkle-1" />
    <circle cx="940" cy="60" r="2.5" fill="#38bdf8" class="twinkle-2" />
    <circle cx="1120" cy="210" r="2" fill="#c084fc" class="twinkle-3" />

    <!-- ================= LEFT COLUMN: HERO HEADLINE ================= -->
    <g transform="translate(460, 50)">
      <!-- Pill Badge: 2026 BENCHMARK -->
      <g>
        <rect x="0" y="0" width="285" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <circle cx="16" cy="16" r="8" fill="none" stroke="#10b981" stroke-width="1.5" class="beacon-ring" />
        <text x="32" y="21" fill="#94a3b8" class="text-mono" font-size="12" font-weight="600" letter-spacing="1.2">2026 GLOBAL BENCHMARK</text>
      </g>

      <!-- Main Headline -->
      <text x="0" y="85" fill="#f8fafc" class="text-title" font-size="44" font-weight="900" letter-spacing="-1">
        COUNTRIES PER-CAPITA
      </text>
      <text x="0" y="135" fill="url(#titleGrad)" class="text-title pulse-glow" font-size="44" font-weight="900" letter-spacing="-1">
        COMPARISON
      </text>

      <!-- Subtitle Description -->
      <text x="0" y="175" fill="#94a3b8" class="text-sans" font-size="16" font-weight="400">
        Empirical individual-level analysis across economic power,
      </text>
      <text x="0" y="200" fill="#94a3b8" class="text-sans" font-size="16" font-weight="400">
        consumption living standards, and public infrastructure velocity.
      </text>

      <!-- Country Tag Pills -->
      <g transform="translate(0, 235)">
        <!-- US Pill -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="140" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5" />
          <circle cx="20" cy="21" r="5" fill="#3b82f6" />
          <text x="34" y="21" fill="#f1f5f9" class="text-sans" font-size="13" font-weight="700">United States</text>
          <text x="34" y="33" fill="#60a5fa" class="text-mono" font-size="10">$94.4k GDP</text>
        </g>

        <!-- EU Pill -->
        <g transform="translate(152, 0)">
          <rect x="0" y="0" width="140" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.5" />
          <circle cx="20" cy="21" r="5" fill="#818cf8" />
          <text x="34" y="21" fill="#f1f5f9" class="text-sans" font-size="13" font-weight="700">European Union</text>
          <text x="34" y="33" fill="#a78bfa" class="text-mono" font-size="10">$68.0k PPP</text>
        </g>

        <!-- China Pill -->
        <g transform="translate(304, 0)">
          <rect x="0" y="0" width="140" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" />
          <circle cx="20" cy="21" r="5" fill="#ef4444" />
          <text x="34" y="21" fill="#f1f5f9" class="text-sans" font-size="13" font-weight="700">China</text>
          <text x="34" y="33" fill="#f87171" class="text-mono" font-size="10">108.2 ft Rail</text>
        </g>
      </g>

      <!-- Micro metadata footer -->
      <g transform="translate(0, 312)">
        <text x="0" y="0" fill="#475569" class="text-mono" font-size="11" letter-spacing="0.5">
          STANDARDIZED POPULATION UNITS • 2026 FORECAST &amp; OBSERVED INDICES
        </text>
      </g>
    </g>

    <!-- ================= RIGHT COLUMN: INTERACTIVE DATA CARD ================= -->
    <g transform="translate(680, 42)" class="float-slow">
      <!-- Glassmorphic Card Container -->
      <rect x="0" y="0" width="460" height="345" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />
      
      <!-- Card Header -->
      <g transform="translate(26, 28)">
        <text x="0" y="0" fill="#f8fafc" class="text-title" font-size="16" font-weight="700">KEY METRICS AT A GLANCE</text>
        <text x="320" y="0" fill="#38bdf8" class="text-mono" font-size="11" font-weight="600">PER CAPITA</text>
        <line x1="0" y1="14" x2="408" y2="14" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      </g>

      <!-- Metric 1: GDP (PPP) -->
      <g transform="translate(26, 68)">
        <text x="0" y="10" fill="#cbd5e1" class="text-sans" font-size="12" font-weight="600">GDP Purchasing Power (PPP)</text>
        <text x="408" y="10" text-anchor="end" fill="#64748b" class="text-mono" font-size="11">USD ($)</text>

        <!-- US Bar -->
        <g transform="translate(0, 18)">
          <text x="0" y="12" fill="#94a3b8" class="text-mono" font-size="10">USA</text>
          <rect x="36" y="2" width="270" height="13" rx="4" fill="#1e293b" />
          <rect x="36" y="2" width="210" height="13" rx="4" fill="url(#usGrad)" class="bar-anim-1" />
          <text x="256" y="12" fill="#f8fafc" class="text-mono" font-size="10" font-weight="600">$94,430</text>
        </g>

        <!-- EU Bar -->
        <g transform="translate(0, 36)">
          <text x="0" y="12" fill="#94a3b8" class="text-mono" font-size="10">EU</text>
          <rect x="36" y="2" width="270" height="13" rx="4" fill="#1e293b" />
          <rect x="36" y="2" width="151" height="13" rx="4" fill="url(#euGrad)" class="bar-anim-2" />
          <text x="196" y="12" fill="#f8fafc" class="text-mono" font-size="10" font-weight="600">$67,960</text>
        </g>

        <!-- CN Bar -->
        <g transform="translate(0, 54)">
          <text x="0" y="12" fill="#94a3b8" class="text-mono" font-size="10">CN</text>
          <rect x="36" y="2" width="270" height="13" rx="4" fill="#1e293b" />
          <rect x="36" y="2" width="70" height="13" rx="4" fill="url(#cnGrad)" class="bar-anim-3" />
          <text x="116" y="12" fill="#f8fafc" class="text-mono" font-size="10" font-weight="600">$31,600</text>
        </g>
      </g>

      <!-- Metric 2: Living Space vs High-Speed Rail Split Visualizer -->
      <g transform="translate(26, 168)">
        <line x1="0" y1="0" x2="408" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

        <!-- High Speed Rail -->
        <g transform="translate(0, 18)">
          <text x="0" y="0" fill="#cbd5e1" class="text-sans" font-size="12" font-weight="600">High-Speed Rail Track Per 1k People</text>
          
          <!-- Track Comparison Dots & Nodes -->
          <g transform="translate(0, 12)">
            <!-- CN Rail -->
            <rect x="0" y="4" width="130" height="34" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" />
            <text x="10" y="20" fill="#fca5a5" class="text-sans" font-size="10" font-weight="600">🇨🇳 China</text>
            <text x="10" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">108.2 ft</text>

            <!-- EU Rail -->
            <rect x="138" y="4" width="130" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
            <text x="148" y="20" fill="#c7d2fe" class="text-sans" font-size="10" font-weight="600">🇪🇺 EU-27</text>
            <text x="148" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">91.8 ft</text>

            <!-- US Rail -->
            <rect x="276" y="4" width="132" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
            <text x="286" y="20" fill="#93c5fd" class="text-sans" font-size="10" font-weight="600">🇺🇸 USA</text>
            <text x="286" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">0.23 ft</text>
          </g>
        </g>

        <!-- Residential Floor Space -->
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#cbd5e1" class="text-sans" font-size="12" font-weight="600">Avg Residential Floor Space</text>

          <g transform="translate(0, 12)">
            <!-- US Space -->
            <rect x="0" y="4" width="130" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
            <text x="10" y="20" fill="#93c5fd" class="text-sans" font-size="10" font-weight="600">🇺🇸 USA</text>
            <text x="10" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">810 sq ft</text>

            <!-- EU Space -->
            <rect x="138" y="4" width="130" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
            <text x="148" y="20" fill="#c7d2fe" class="text-sans" font-size="10" font-weight="600">🇪🇺 EU-27</text>
            <text x="148" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">430 sq ft</text>

            <!-- CN Space -->
            <rect x="276" y="4" width="132" height="34" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" />
            <text x="286" y="20" fill="#fca5a5" class="text-sans" font-size="10" font-weight="600">🇨🇳 China</text>
            <text x="286" y="32" fill="#f8fafc" class="text-mono" font-size="11" font-weight="700">425 sq ft</text>
          </g>
        </g>
      </g>

      <!-- Decorative Live Indicator in Card -->
      <circle cx="434" cy="26" r="3" fill="#38bdf8" />
      <circle cx="434" cy="26" r="6" fill="none" stroke="#38bdf8" stroke-width="1" class="beacon-ring-delay" />
    </g>

    <!-- Outer Decorative Border Stroke -->
    <rect x="1" y="1" width="1198" height="438" rx="19" ry="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
  </g>
</svg>
